# pnpm settings (pnpm 11 moved these out of package.json).
# Allow native install scripts we trust: esbuild (tsx, which renders the emails), sharp (Next.js image optimization) and
# unrs-resolver (ESLint's native module resolver).
allowBuilds:
    esbuild: true
    sharp: true
    unrs-resolver: true
# pnpm 11 holds back any package published less than a day ago (minimumReleaseAge). Our own lint
# package is exempt: we publish it and install it the same hour. Drop the entry once 0.4.0 is a
# day old, or leave it; it names one exact version.
minimumReleaseAgeExclude:
    - "@strakzat/eslint-config-ui@0.4.0"
onlyBuiltDependencies:
    - esbuild
    - sharp
    - unrs-resolver
