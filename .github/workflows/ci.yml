name: CI
on: [pull_request]

permissions:
    contents: read
    # @strakzat packages are internal on GitHub Packages; the per-run token reads them.
    packages: read

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            # Credential for the internal @strakzat scope, in the runner's own npmrc (never the repo's).
            - name: Authenticate to GitHub Packages
              run: npm config set //npm.pkg.github.com/:_authToken "$GITHUB_TOKEN" --location=user
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - run: pnpm install --frozen-lockfile

            # gitleaks is not preinstalled on the runner; without it verify.sh reports the secrets
            # stage as skipped. Pinned so the same commit scans the same way twice.
            - name: Install gitleaks
              env:
                  GITLEAKS_VERSION: 8.30.1
              run: |
                  curl -sSfL \
                    "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
                    | tar -xz -C /usr/local/bin gitleaks

            - run: ./scripts/verify.sh
